name: Release

# Publishes to PyPI when a GitHub release is published. The release tag must be
# the package version with a "v" prefix, e.g. v0.2.0.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --locked pytest
      - run: uv build
      - name: Check the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/engparams-${version}-py3-none-any.whl" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match the built package:" dist/*
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/engparams/
    permissions:
      id-token: write # for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
