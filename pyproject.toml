[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parameter"
description = "Engineering parameters with units: load from YAML, convert to SI, calculate and tabulate."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Davidson", email = "matthew@davidson.engineering" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pint>=0.24.4",
  "prettytable>=3.12",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.7"]

[project.scripts]
parameter = "parameter.cli:main"

[project.urls]
Repository = "https://github.com/davidson-engineering/parameter"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pydantic>=2.7",
  "pytest>=8",
  "ruff>=0.13",
  "types-pyyaml>=6.0.1",
]

[tool.setuptools.dynamic]
version = { attr = "parameter.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
xfail_strict = true

[tool.mypy]
files = ["src"]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "NPY", "RUF"]
